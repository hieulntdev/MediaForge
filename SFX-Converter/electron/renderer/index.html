<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>SFX Converter</title>
    <script src="./src/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="./src/styles/variables.css">
    <link rel="stylesheet" href="./src/styles/base.css">
    <link rel="stylesheet" href="./src/styles/components.css">
    <link rel="stylesheet" href="./src/styles/layout.css">
    <script src="./src/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
    <main class="app-content">
      <section class="path-section" aria-labelledby="video-title">
        <div class="section-heading">
          <div class="section-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path class="icon-fill" d="m10 9 5 3-5 3Z"></path></svg>
          </div>
          <div>
            <h2 id="video-title">Select Video</h2>
            <p>Choose a video to process; FFprobe verifies the media format</p>
          </div>
        </div>
        <div class="path-controls">
          <button id="browse-video" class="file-picker" type="button" aria-label="Select video. No video selected">
            <svg class="file-picker-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path class="icon-fill" d="m10 9 5 3-5 3Z"></path></svg>
            <span id="video-path" class="file-picker-value placeholder">No video selected</span>
          </button>
        </div>
      </section>

      <section class="path-section" aria-labelledby="output-title">
        <div class="section-heading">
          <div class="section-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 7.5h7l2-2h9v13H3Z"></path></svg>
          </div>
          <div>
            <h2 id="output-title">Output Folder</h2>
            <p>Defaults to the video folder; output is saved as &lt;name&gt;_sfx.wav</p>
          </div>
        </div>
        <div class="path-controls">
          <button id="browse-output" class="file-picker" type="button" aria-label="Select output folder. No folder selected">
            <svg class="file-picker-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5h7l2-2h9v13H3Z"></path></svg>
            <span id="output-path" class="file-picker-value placeholder">No folder selected</span>
          </button>
        </div>
      </section>

      <div class="action-row">
        <button id="run-button" class="button button-primary" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7 8 5-8 5Z"></path></svg>
          Extract SFX
        </button>
        <button id="cancel-button" class="button button-destructive cancel-button" type="button" hidden>Cancel Processing</button>
      </div>

      <div class="progress-section">
        <div class="status-row" role="status" aria-live="polite">
          <span id="status-label">Ready</span>
          <span id="progress-value">0.0%</span>
        </div>
        <div id="progress-track" class="progress-track" role="progressbar" aria-label="Processing progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>

      <section class="log-section" aria-labelledby="log-title">
        <div class="log-header">
          <h2 id="log-title">Activity Log</h2>
          <button id="clear-log" class="button button-ghost button-micro" type="button">Clear</button>
        </div>
        <div id="log-view" class="log-view" role="log" aria-label="Processing activity log" aria-live="polite" tabindex="0">
          <div class="log-empty">No activity yet.</div>
        </div>
      </section>
    </main>
    <button id="theme-toggle" class="button button-icon theme-toggle" type="button" hidden aria-label="Switch to dark mode">
      <svg id="theme-sun" class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.5"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
      </svg>
      <svg id="theme-moon" class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 15.25A8.5 8.5 0 0 1 8.75 4 8.5 8.5 0 1 0 20 15.25Z"></path>
      </svg>
    </button>
    </div>

    <dialog id="error-dialog" class="error-dialog" aria-labelledby="error-title">
      <div class="dialog-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 8v5M12 17h.01"></path><circle cx="12" cy="12" r="9"></circle></svg>
      </div>
      <h2 id="error-title">Unable to Extract SFX</h2>
      <p id="error-message"></p>
      <form method="dialog"><button class="button button-primary" value="close">Close</button></form>
    </dialog>
  </body>
</html>
